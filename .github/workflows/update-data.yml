name: Update phone data

on:
  schedule:
    - cron: '17 3 1 * *'      # 03:17 UTC on the 1st of every month
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write              # needed to publish the release and the keep-alive commit

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the source data
        run: |
          mkdir -p work
          curl -fL --retry 3 --retry-delay 10 -o work/tacdb.json "http://tacdb.osmocom.org/export/tacdb.json"
          curl -fL --retry 3 --retry-delay 10 -o work/tac_full.csv "https://raw.githubusercontent.com/MoazEb/tac-database/main/tac_full.csv"
          ls -la work

      - name: Get the previous manifest (if any)
        run: |
          curl -fsL -o work/previous_manifest.json "https://github.com/${{ github.repository }}/releases/download/data/manifest.json" \
            || echo '{}' > work/previous_manifest.json

      - name: Build the database and run safety checks
        id: build
        run: |
          python3 publish_manifest.py \
            --tacdb work/tacdb.json \
            --community-csv work/tac_full.csv \
            --previous work/previous_manifest.json \
            --repo "${{ github.repository }}" \
            --out dist

      - name: Publish the release files
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data \
            --title "Phone data (automatic)" --notes-file NOTICE.md
          gh release upload data dist/phonecheck_data.db.gz dist/manifest.json --clobber

      - name: Keep the schedule alive
        run: |
          date -u +%FT%TZ > last_run.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add last_run.txt
          git commit -m "Data pipeline ran" || true
          git push || true
